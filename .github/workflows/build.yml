name: Build GyroLock Vulkan APK

on: workflow_dispatch: push:branches:-main-master

jobs:build:name:Build Android APK runs-on: ubuntu-latest

env:
  ANDROID_NDK_VERSION: 27.2.12479018

steps:
  - name: Checkout source
    uses: actions/checkout@v4

  - name: Set up Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'
      cache: gradle

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Install Android SDK and NDK
    run: |
      yes | sdkmanager --licenses || true
      sdkmanager --install \
        "platform-tools" \
        "platforms;android-35" \
        "build-tools;35.0.0" \
        "ndk;27.2.12479018" \
        "cmake;3.22.1"

  - name: Configure Android environment
    run: |
      echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
      echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

  - name: Verify SDK and NDK
    run: |
      echo "Android SDK: $ANDROID_HOME"
      echo "Android NDK: $ANDROID_HOME/ndk/27.2.12479018"
      sdkmanager --list_installed
      test -f "$ANDROID_HOME/ndk/27.2.12479018/source.properties"
      cat "$ANDROID_HOME/ndk/27.2.12479018/source.properties"
      cmake --version

  - name: Install Vulkan shader compiler
    run: |
      sudo apt-get update
      sudo apt-get install -y glslang-tools
      glslangValidator --version

  - name: Grant Gradle permission
    run: |
      if [ -f "./gradlew" ]; then
        chmod +x ./gradlew
      fi

  - name: Build debug APK
    run: |
      if [ -f "./gradlew" ]; then
        ./gradlew --no-daemon --stacktrace assembleDebug
      elif command -v gradle >/dev/null 2>&1; then
        gradle --no-daemon --stacktrace assembleDebug
      else
        echo "ERROR: Gradle wrapper or Gradle installation not found."
        exit 1
      fi

  - name: Upload APK
    if: success()
    uses: actions/upload-artifact@v4
    with:
      name: GyroLock-V28-Vulkan-debug-apk
      path: app/build/outputs/apk/debug/*.apk
      if-no-files-found: error
      retention-days: 7

  - name: Upload build reports
    if: failure()
    uses: actions/upload-artifact@v4
    with:
      name: GyroLock-V28-build-reports
      path: |
        **/build/reports/
        **/build/outputs/logs/
      if-no-files-found: ignore
      retention-days: 7
