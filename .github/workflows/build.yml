name: Build GyroLock Vulkan APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Build Android Vulkan APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK, CMake and GLSL compiler
        run: |
          sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"
          sudo apt-get update
          sudo apt-get install -y glslang-tools

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Show build environment
        run: |
          java -version
          gradle --version
          glslangValidator --version

      - name: Build debug APK with native Vulkan renderer
        run: gradle --no-daemon --stacktrace clean assembleDebug

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GyroLock-V28-Vulkan-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
